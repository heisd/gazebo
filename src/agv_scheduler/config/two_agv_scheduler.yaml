agv_scheduler:
  ros__parameters:
    agv_ids: ["agv_01", "agv_02"]
    nav_action_names:
      - "/agv_01/navigate_to_pose"
      - "/agv_02/navigate_to_pose"
    base_frames:
      - "agv_01_base_footprint"
      - "agv_02_base_footprint"
    odom_topics:
      - "/agv_01/odom"
      - "/agv_02/odom"
    cmd_vel_topics:
      - "/agv_01/cmd_vel"
      - "/agv_02/cmd_vel"
    status_topics:
      - "/agv_01/agv_status"
      - "/agv_02/agv_status"
    pose_source: "map_then_odom"
    map_frame: "map"
    route_cell_size: 1.5
    route_hold_timeout: 180.0
    reservation_refresh_interval: 2.0
    pose_stale_timeout: 8.0
    wait_point_tolerance: 0.35
    safety_stop_distance: 1.0
    right_of_way_release_distance: 1.6
    yield_hold_duration: 2.0
    yield_cooldown_duration: 3.0
    pickup_pause_duration: 4.0
    auto_demo_enabled: false
    battery_drain_moving: 0.3
    battery_drain_idle: 0.02
    battery_charge_rate: 1.0
    battery_low_threshold: 20.0
    battery_full_threshold: 95.0
